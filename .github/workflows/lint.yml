name: lint
permissions: read-all
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      # No formatter/linter was previously configured — ruff enforces PEP 8
      # (the language's own standard) rather than an arbitrary house style.
      - run: ruff check server/

  static-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # No project-local Prettier config exists (no package.json, no build
      # step by design) — run it with its own defaults via npx instead of
      # adopting a house style nobody agreed on.
      - run: npx --yes prettier@3 --check "static/**/*.{js,css,html}"
