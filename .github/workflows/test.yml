name: test
permissions: read-all
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest playwright

      - name: Run pytest (server/tests)
        run: cd server && python3 -m pytest tests -q

      - name: Run VAD unit test (Node)
        run: node static/tests/voice-vad.test.cjs

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Run browser integration test
        run: python3 static/tests/browser_checks.py
