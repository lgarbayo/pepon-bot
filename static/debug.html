<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeponBot — camera debug</title>
<style>
  html, body {
    margin: 0;
    padding: 16px;
    background: #0b0e14;
    color: #cdd6e4;
    font-family: -apple-system, system-ui, sans-serif;
  }
  h1 { font-size: 16px; letter-spacing: 1px; opacity: 0.8; margin: 0 0 16px; }
  #frame-container {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 8px;
    border: 1px solid #222;
    overflow: hidden;
  }
  #frame {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.5;
  }
  table { margin-top: 16px; border-collapse: collapse; font-size: 14px; }
  td { padding: 4px 12px 4px 0; }
  td.label { opacity: 0.6; }
  .stale { color: #e74c3c; font-weight: bold; }
  .fresh { color: #33e0a1; font-weight: bold; }
  #detections { margin-top: 16px; font-size: 13px; }
  #detections div { padding: 3px 0; }
  .cls { color: #33e0a1; font-weight: bold; }
  #world-state {
    font-size: 12px;
    background: #12141a;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    max-width: 640px;
  }
  #voice-form { margin-top: 8px; display: flex; gap: 8px; max-width: 640px; }
  #voice-text {
    flex: 1;
    background: #12141a;
    border: 1px solid #222;
    border-radius: 6px;
    color: #cdd6e4;
    padding: 8px 10px;
    font-size: 14px;
  }
  #voice-form button {
    background: #33e0a1;
    color: #0b0e14;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
  }
  #voice-result { margin-top: 8px; font-size: 12px; opacity: 0.8; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>PEPONBOT — CAMERA DEBUG</h1>
  <div id="frame-container">
    <img id="frame" style="display:none;">
    <canvas id="overlay"></canvas>
    <div id="placeholder">waiting for first frame...</div>
  </div>

  <table>
    <tr><td class="label">frames received</td><td id="stat-frames">-</td></tr>
    <tr><td class="label">fps</td><td id="stat-fps">-</td></tr>
    <tr><td class="label">dimensions</td><td id="stat-dims">-</td></tr>
    <tr><td class="label">last frame</td><td id="stat-age">-</td></tr>
    <tr><td class="label">pepon state</td><td id="stat-pepon-state">-</td></tr>
    <tr><td class="label">last motion event</td><td id="stat-motion">-</td></tr>
    <tr><td class="label">last voice heard</td><td id="stat-voice-heard">-</td></tr>
    <tr><td class="label">last voice error</td><td id="stat-voice-error">-</td></tr>
  </table>

  <div id="detections">no detections yet</div>

  <h1 style="margin-top:24px;">WORLD STATE</h1>
  <pre id="world-state">-</pre>

  <h1 style="margin-top:24px;">VOICE COMMAND (manual test, no mic needed)</h1>
  <form id="voice-form">
    <input id="voice-text" type="text" placeholder="e.g. Find the bottle" autocomplete="off">
    <button type="submit">Send</button>
  </form>
  <div id="voice-result"></div>

  <script>
    const img = document.getElementById('frame');
    const placeholder = document.getElementById('placeholder');
    const overlay = document.getElementById('overlay');
    const octx = overlay.getContext('2d');
    let frameW = 0;
    let frameH = 0;

    async function refreshFrame() {
      const res = await fetch(`/api/camera/frame.jpg?t=${Date.now()}`);
      if (res.ok) {
        const blob = await res.blob();
        img.src = URL.createObjectURL(blob);
        img.style.display = 'block';
        placeholder.style.display = 'none';
      }
    }

    async function refreshStats() {
      const res = await fetch('/api/camera/stats');
      const s = await res.json();
      frameW = s.width;
      frameH = s.height;
      document.getElementById('stat-frames').textContent = s.frames_received;
      document.getElementById('stat-fps').textContent = s.fps;
      document.getElementById('stat-dims').textContent = s.width && s.height ? `${s.width} x ${s.height}` : '-';
      const ageEl = document.getElementById('stat-age');
      if (s.seconds_since_last_frame === null) {
        ageEl.textContent = 'never';
        ageEl.className = '';
      } else {
        const fresh = s.seconds_since_last_frame < 1.5;
        ageEl.textContent = `${s.seconds_since_last_frame}s ago`;
        ageEl.className = fresh ? 'fresh' : 'stale';
      }
    }

    async function refreshDetections() {
      const res = await fetch('/api/detections');
      const d = await res.json();
      drawBoxes(d.objects);
      const list = document.getElementById('detections');
      list.innerHTML = d.objects.length
        ? d.objects.map(o =>
            `<div><span class="cls">${o.class}</span> conf=${o.confidence} x=${o.x} y=${o.y}</div>`
          ).join('')
        : 'no objects detected';
    }

    function drawBoxes(objects) {
      const displayW = overlay.clientWidth;
      const displayH = overlay.clientHeight;
      overlay.width = displayW;
      overlay.height = displayH;
      octx.clearRect(0, 0, displayW, displayH);
      if (!frameW || !frameH || !objects.length) return;

      // img is object-fit:contain inside the container — figure out the
      // actual letterboxed rect the frame is drawn into before scaling boxes.
      const scale = Math.min(displayW / frameW, displayH / frameH);
      const drawW = frameW * scale;
      const drawH = frameH * scale;
      const offsetX = (displayW - drawW) / 2;
      const offsetY = (displayH - drawH) / 2;

      octx.strokeStyle = '#33e0a1';
      octx.lineWidth = 2;
      octx.font = '13px -apple-system, system-ui, sans-serif';
      octx.textBaseline = 'bottom';

      for (const o of objects) {
        const [x1, y1, x2, y2] = o.bbox;
        const bx = offsetX + x1 * scale;
        const by = offsetY + y1 * scale;
        const bw = (x2 - x1) * scale;
        const bh = (y2 - y1) * scale;
        octx.strokeRect(bx, by, bw, bh);
        const label = `${o.class} ${o.confidence}`;
        const textW = octx.measureText(label).width;
        octx.fillStyle = '#33e0a1';
        octx.fillRect(bx, Math.max(0, by - 16), textW + 6, 16);
        octx.fillStyle = '#0b0e14';
        octx.fillText(label, bx + 3, Math.max(16, by));
      }
    }

    async function refreshMotion() {
      const [stateRes, motionRes] = await Promise.all([
        fetch('/api/state'),
        fetch('/api/motion'),
      ]);
      const state = await stateRes.json();
      const motion = await motionRes.json();
      document.getElementById('stat-pepon-state').textContent = state.state;
      document.getElementById('stat-motion').textContent = motion.last_event
        ? `${motion.last_event} (${Math.round((Date.now() / 1000) - motion.last_event_at)}s ago)`
        : 'none yet';
    }

    async function refreshVoiceStatus() {
      const res = await fetch('/api/voice/status');
      const v = await res.json();
      document.getElementById('stat-voice-heard').textContent = v.last_heard
        ? `"${v.last_heard.text}" (${Math.round((Date.now() / 1000) - v.last_heard.at)}s ago)`
        : 'nothing yet';
      const errEl = document.getElementById('stat-voice-error');
      errEl.textContent = v.last_error
        ? `${v.last_error.error} (${Math.round((Date.now() / 1000) - v.last_error.at)}s ago)`
        : 'none';
      errEl.className = v.last_error ? 'stale' : '';
    }

    async function refreshWorld() {
      const res = await fetch('/api/world');
      const world = await res.json();
      document.getElementById('world-state').textContent = JSON.stringify(world, null, 2);
    }

    document.getElementById('voice-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('voice-text');
      const text = input.value.trim();
      if (!text) return;
      const res = await fetch('/api/voice_command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();
      document.getElementById('voice-result').textContent = JSON.stringify(data.intent, null, 2);
    });

    setInterval(refreshFrame, 300);
    setInterval(refreshStats, 500);
    setInterval(refreshDetections, 400);
    setInterval(refreshMotion, 500);
    setInterval(refreshVoiceStatus, 500);
    setInterval(refreshWorld, 500);
    refreshFrame();
    refreshStats();
    refreshDetections();
    refreshMotion();
    refreshVoiceStatus();
    refreshWorld();
  </script>
</body>
</html>
