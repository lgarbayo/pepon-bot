<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeponBot</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="status-bar">
    <span id="status-dot"></span>
    <span id="status-text">CONNECTING...</span>
  </div>

  <div id="face" class="state-idle">
    <div class="eye" id="eye-left">
      <div class="eye-inner">
        <div class="dizzy-wrap">
          <div class="pupil-wrap"><div class="pupil"></div></div>
        </div>
      </div>
    </div>
    <div class="eye" id="eye-right">
      <div class="eye-inner">
        <div class="dizzy-wrap">
          <div class="pupil-wrap"><div class="pupil"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="state-label">IDLE</div>

  <button id="talk-btn" type="button">🎤 TAP TO TALK</button>

  <script src="/static/app.js"></script>
</body>
</html>
